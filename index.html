<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tyquest</title>
  <meta name="description" content="Tyquest — something new is on the way.">
  <style>
    :root {
      --bg: #fafaf8;
      --fg: #1a1a18;
      --muted: #6b6b66;
      --accent: #3b5bdb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12120f;
        --fg: #f2f2ee;
        --muted: #9a9a92;
        --accent: #8da2fb;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    h1 span { color: var(--accent); }
    p {
      margin: 1rem 0 0;
      font-size: 1.125rem;
      color: var(--muted);
    }
    footer {
      padding: 24px 16px;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Ty<span>quest</span></h1>
    <p>Something new is on the way.</p>
  </main>
  <footer>&copy; 2026 Tyquest</footer>
</body>
</html>
