<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tyquest</title>
  <meta name="description" content="Tyquest — something new is on the way.">
  <script>
    // Hide the letters before first paint only when we are going to animate them in.
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('js');
    }
  </script>
  <style>
    :root {
      --bg: #f6f1e9;
      --fg: #1d1b2e;
      --muted: #6e6a7c;
      --a1: #e2553e;   /* vermilion */
      --a2: #f0a03a;   /* amber */
      --glow: rgba(240, 160, 58, 0.16);
      --line: rgba(29, 27, 46, 0.08);
      --shadow: rgba(226, 85, 62, 0.2);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #13111c;
        --fg: #f4efe6;
        --muted: #9b96a8;
        --a1: #ff7a59;   /* coral */
        --a2: #ffc35e;   /* gold */
        --glow: rgba(255, 122, 89, 0.12);
        --line: rgba(244, 239, 230, 0.07);
        --shadow: rgba(255, 122, 89, 0.24);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 60% 45% at 50% 45%, var(--glow), transparent 70%) fixed,
        var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      text-align: center;
    }
    footer {
      position: relative;
      z-index: 1;
      padding: 24px 16px;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
    }

    /* Text that is read aloud once; the animated copies are hidden from assistive tech. */
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* ---- Background marquee ---- */
    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .bg-in {
      position: absolute;
      left: -20%;
      right: -20%;
      top: 50%;
      display: flex;
      flex-direction: column;
      gap: 1.5vh;
      transform: translateY(-50%) rotate(-8deg);
    }
    .row {
      white-space: nowrap;
      font-size: clamp(4rem, 13vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      color: transparent;
      -webkit-text-stroke: 1px var(--line);
      will-change: transform;
    }
    .u { display: inline-block; padding-right: 0.35em; }

    /* ---- Particles, sparks and shockwaves ---- */
    .fx {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ---- Cursor ring (mouse devices only, added by script) ---- */
    .cursor {
      position: fixed;
      left: 0;
      top: 0;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      border: 1.5px solid var(--a1);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.3s ease, background-color 0.3s ease;
      will-change: transform;
    }
    .cursor.on { opacity: 0.85; }
    .cursor.over { background-color: color-mix(in srgb, var(--a1) 14%, transparent); }

    /* ---- Wordmark ---- */
    h1 {
      margin: 0;
      font-size: clamp(3rem, 13vw, 6.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      perspective: 800px;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      touch-action: none;   /* letters can be dragged on touch screens */
    }
    .dragging, .dragging * { cursor: grabbing !important; }
    .vis { display: inline-block; transform-style: preserve-3d; will-change: transform; }
    .ch { display: inline-block; text-align: center; transform-style: preserve-3d; }
    /* "quest" steps through the accent gradient, one letter at a time. */
    .ch.accent {
      color: var(--a1);
      color: color-mix(in oklab, var(--a1), var(--a2) calc(var(--p, 0) * 100%));
    }
    .in {
      display: inline-block;
      will-change: transform, opacity;
      text-shadow: var(--sx, 0px) var(--sy, 6px) 0 var(--shadow);
    }
    .js .in { opacity: 0; }

    /* ---- Tagline with per-letter flipping word ---- */
    .tag {
      margin: 1.25rem 0 0;
      font-size: 1.125rem;
      color: var(--muted);
    }
    .rot {
      display: inline-block;
      position: relative;
      vertical-align: bottom;
      height: 1.5em;
      color: var(--a1);
      font-weight: 600;
      perspective: 400px;
    }
    .js .rot { transition: width 0.5s cubic-bezier(0.2, 0.9, 0.25, 1); }
    .w { position: absolute; left: 0; top: 0; white-space: nowrap; }
    .c {
      display: inline-block;
      opacity: 0;
      transform: rotateX(90deg) translateY(0.3em);
      transition:
        transform 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.25) calc(var(--j) * 40ms),
        opacity 0.3s ease calc(var(--j) * 40ms);
    }
    .w.on .c { opacity: 1; transform: none; }
    .w.out .c { opacity: 0; transform: rotateX(-90deg) translateY(-0.3em); }

    .hint {
      margin: 2rem 0 0;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .js .tag { opacity: 0; transition: opacity 0.8s ease; }
    .js .tag.show { opacity: 1; }
    /* The hint's text is in place from the start, so revealing it never shifts the layout. */
    .js .hint {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 1.4s ease, transform 1.4s cubic-bezier(0.2, 0.9, 0.25, 1);
    }
    .js .hint.show { opacity: 0.75; transform: none; }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-in">
      <div class="row"><span class="u">TYQUEST —</span></div>
      <div class="row"><span class="u">SOMETHING NEW —</span></div>
      <div class="row"><span class="u">ON THE WAY —</span></div>
    </div>
  </div>
  <canvas class="fx" aria-hidden="true"></canvas>

  <main>
    <h1 class="word">
      <span class="sr">Tyquest</span>
      <span class="vis" aria-hidden="true">Tyquest</span>
    </h1>
    <p class="tag">
      <span class="sr">Something new is on the way.</span>
      <span aria-hidden="true">Something <span class="rot">new</span> is on the way.</span>
    </p>
    <p class="hint" aria-hidden="true">Move · click to scatter · drag a letter</p>
  </main>
  <footer>&copy; 2026 Tyquest</footer>

  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var root = document.documentElement;
      var h1 = document.querySelector('.word');
      var vis = h1.querySelector('.vis');
      var tag = document.querySelector('.tag');
      var hint = document.querySelector('.hint');
      var t0 = performance.now();
      var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      if (window.matchMedia('(hover: none)').matches) hint.textContent = 'Tap to scatter · drag a letter';

      /* ---------- Colours (read from the CSS palette, refreshed on theme change) ---------- */
      var A1 = [255, 122, 89], A2 = [255, 195, 94];
      function hex(h) {
        h = h.replace('#', '');
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
      }
      function readColors() {
        var cs = getComputedStyle(root);
        A1 = hex(cs.getPropertyValue('--a1').trim());
        A2 = hex(cs.getPropertyValue('--a2').trim());
      }
      function col(p, a) {
        return 'rgba(' + ((A1[0] + (A2[0] - A1[0]) * p) | 0) + ',' + ((A1[1] + (A2[1] - A1[1]) * p) | 0) + ',' +
               ((A1[2] + (A2[2] - A1[2]) * p) | 0) + ',' + a.toFixed(3) + ')';
      }
      readColors();
      var darkMq = window.matchMedia('(prefers-color-scheme: dark)');
      if (darkMq.addEventListener) darkMq.addEventListener('change', readColors);

      /* ---------- Background marquee ---------- */
      var rows = [].map.call(document.querySelectorAll('.row'), function (el, n) {
        return { el: el, unit: el.querySelector('.u'), w: 0, off: Math.random() * 400,
                 dir: n % 2 ? 1 : -1, speed: [34, 24, 42][n] };
      });
      function measureRows() {
        rows.forEach(function (r) {
          r.w = r.unit.offsetWidth;   // layout width, unaffected by the rotation
          if (!r.w) return;
          while (r.el.children.length * r.w < window.innerWidth * 1.6 + 2 * r.w) {
            r.el.appendChild(r.unit.cloneNode(true));
          }
        });
      }

      /* ---------- Canvas: particles, sparks, shockwaves ---------- */
      var canvas = document.querySelector('.fx');
      var ctx = canvas.getContext('2d');
      var VW = 0, VH = 0;
      var P = [], S = [], WAVES = [];
      function sizeCanvas() {
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        VW = window.innerWidth; VH = window.innerHeight;
        canvas.width = Math.round(VW * dpr); canvas.height = Math.round(VH * dpr);
        canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var n = Math.round(Math.min(170, Math.max(60, VW * VH / 8000)));
        P = [];
        for (var k = 0; k < n; k++) {
          P.push({ x: Math.random() * VW, y: Math.random() * VH, vx: 0, vy: 0,
                   r: 0.8 + Math.random() * 1.6, p: Math.random(), a: 0.18 + Math.random() * 0.32 });
        }
      }
      function spark(x, y, vx, vy, life) {
        if (S.length > 700) S.shift();
        S.push({ x: x, y: y, vx: vx, vy: vy, life: life, max: life, p: Math.random() });
      }

      /* ---------- Wordmark letters ---------- */
      var text = vis.textContent.trim();
      vis.textContent = '';
      var UPPER = 'ABCDEFGHJKLMNPQRSTUVWXYZ#%&@', LOWER = 'abcdefghijkmnopqrstuvwxyz0123456789';
      var L = [];
      for (var i = 0; i < text.length; i++) {
        var ch = document.createElement('span');
        ch.className = 'ch' + (i >= 2 ? ' accent' : '');   // "Ty" + "quest"
        if (i >= 2) ch.style.setProperty('--p', ((i - 2) / (text.length - 3)).toFixed(3));
        var inn = document.createElement('span');
        inn.className = 'in';
        inn.textContent = text[i];
        ch.appendChild(inn);
        vis.appendChild(ch);
        var start = 250 + i * 110;
        L.push({
          ch: ch, inn: inn, final: text[i], i: i, cp: i >= 2 ? (i - 2) / (text.length - 3) : 0,
          pool: text[i] === text[i].toUpperCase() ? UPPER : LOWER,
          start: start, scrambleEnd: start + 520, nextGlyph: 0, showing: text[i],
          x: 0, y: 0, rx: 95, ry: 0, rz: 0, s: 0.8,
          vx: 0, vy: 0, vrx: 0, vry: 0, vrz: 0, vs: 0, op: 0, dragging: false
        });
      }

      var fs = 16;
      function measure() {
        fs = parseFloat(getComputedStyle(h1).fontSize);
        measureRows();
      }
      // Lock each letter's width to its final glyph so scrambling doesn't jostle the line.
      function lockWidths() {
        L.forEach(function (l) { l.ch.style.width = ''; });
        L.forEach(function (l) { l.ch.style.width = l.ch.offsetWidth + 'px'; });
      }
      function unlockWidths() { L.forEach(function (l) { l.ch.style.width = ''; }); }
      measure();
      sizeCanvas();
      lockWidths();
      var widthsLocked = true;
      window.addEventListener('resize', function () {
        measure();
        sizeCanvas();
        if (widthsLocked) lockWidths();
      });

      function centerOf(l) {
        var r = l.ch.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      }
      // Nearest visible letter to a point, by where it is drawn right now.
      function nearestLetter(x, y) {
        var now = performance.now() - t0, best = null, bestD = fs * 0.8;
        for (var n = 0; n < L.length; n++) {
          if (now < L[n].start) continue;
          var c = centerOf(L[n]);
          var vx = c.x + L[n].x, vy = c.y + L[n].y;
          var d = Math.hypot(x - vx, y - vy);
          if (d < bestD) { bestD = d; best = { l: L[n], x: vx, y: vy }; }
        }
        return best;
      }

      /* ---------- Cursor ring ---------- */
      var ring = null, ringX = -100, ringY = -100, ringS = 1, overLetter = false, pressed = false;
      if (finePointer) {
        ring = document.createElement('div');
        ring.className = 'cursor';
        ring.setAttribute('aria-hidden', 'true');
        document.body.appendChild(ring);
      }

      /* ---------- Pointer ---------- */
      var px = -9999, py = -9999, near = false, lastMove = 0, boost = 0;
      var pvx = 0, pvy = 0;   // smoothed pointer velocity, px/s
      var tiltX = 0, tiltY = 0;
      var drag = null;

      window.addEventListener('pointermove', function (e) {
        var now = performance.now();
        if (near && lastMove) {
          var dtm = Math.max(8, now - lastMove);
          var ivx = (e.clientX - px) / dtm * 1000, ivy = (e.clientY - py) / dtm * 1000;
          pvx += (ivx - pvx) * 0.5; pvy += (ivy - pvy) * 0.5;
          boost = Math.min(8, boost + Math.hypot(ivx, ivy) * 0.00035);
        }
        if (!near) { ringX = e.clientX; ringY = e.clientY; }
        px = e.clientX; py = e.clientY; near = true; lastMove = now;
        overLetter = !!nearestLetter(px, py);
        if (drag && !drag.moved && Math.hypot(px - drag.sx, py - drag.sy) > 6) {
          drag.moved = true;
          drag.l.dragging = true;
          root.classList.add('dragging');
        }
      }, { passive: true });
      document.addEventListener('pointerleave', function () { near = false; });
      window.addEventListener('blur', function () { near = false; endDrag(null); });

      // Click or tap: letters scatter away from the point with sparks and a shockwave.
      function scatter(cx, cy) {
        var now = performance.now() - t0;
        if (!widthsLocked) { lockWidths(); widthsLocked = true; }
        L.forEach(function (l) {
          if (now < l.start) return;
          var c = centerOf(l);
          var vx0 = c.x + l.x, vy0 = c.y + l.y;
          var dx = vx0 - cx, dy = vy0 - cy;
          var d = Math.hypot(dx, dy) || 1;
          var power = fs * (9 + Math.random() * 6) * Math.max(0.35, 1 - d / (fs * 6));
          l.vx += dx / d * power;
          l.vy += dy / d * power - fs * 4;
          l.vrz += (Math.random() - 0.5) * 1600;
          l.vrx += (Math.random() - 0.5) * 1100;
          l.vs += 3;
          l.scrambleEnd = now + 250 + Math.random() * 300;
          var base = Math.atan2(dy, dx);
          for (var k = 0; k < 12; k++) {
            var a = base + (Math.random() - 0.5) * 2.4, sp = 150 + Math.random() * 420;
            spark(vx0, vy0, Math.cos(a) * sp, Math.sin(a) * sp - 120, 0.5 + Math.random() * 0.55);
          }
        });
        WAVES.push({ x: cx, y: cy, t: 0, max: Math.max(fs * 7, 260) });
        boost = Math.min(8, boost + 4);
      }

      window.addEventListener('pointerdown', function (e) {
        if (e.button > 0) return;
        px = e.clientX; py = e.clientY; near = true; pressed = true;
        // Letters shy away from the pointer, so grab the nearest one within reach
        // rather than requiring the press to land exactly on its glyph.
        var hit = nearestLetter(e.clientX, e.clientY);
        if (hit) {
          var l = hit.l;
          drag = { l: l, sx: e.clientX, sy: e.clientY, moved: false,
                   ox: e.clientX - hit.x, oy: e.clientY - hit.y };
          try { h1.setPointerCapture(e.pointerId); } catch (err) {}
          pvx = pvy = 0;
          return;
        }
        scatter(e.clientX, e.clientY);
      });
      function endDrag(e) {
        pressed = false;
        if (!drag) return;
        if (!drag.moved) {
          if (e) scatter(e.clientX, e.clientY);
        } else {
          // Throw: hand the pointer's velocity to the letter and let the spring bring it home.
          var l = drag.l;
          l.dragging = false;
          l.vx = pvx; l.vy = pvy;
          l.vrz += pvx * 0.3;
        }
        drag = null;
        root.classList.remove('dragging');
      }
      window.addEventListener('pointerup', function (e) {
        endDrag(e);
        if (e.pointerType !== 'mouse') near = false;
      });
      window.addEventListener('pointercancel', function () { endDrag(null); near = false; });

      /* ---------- Tagline ---------- */
      var rot = document.querySelector('.rot');
      var words = ['new', 'bold', 'bright', 'different', 'exciting'].map(function (t) {
        var w = document.createElement('span');
        w.className = 'w';
        for (var j = 0; j < t.length; j++) {
          var c = document.createElement('span');
          c.className = 'c';
          c.style.setProperty('--j', j);
          c.textContent = t[j];
          w.appendChild(c);
        }
        return w;
      });
      rot.textContent = '';
      words.forEach(function (w) { rot.appendChild(w); });
      var cur = 0;
      function fit() { rot.style.width = words[cur].offsetWidth + 'px'; }
      fit();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fit(); measure(); });
      window.addEventListener('resize', fit);

      setTimeout(function () {
        tag.classList.add('show');
        words[0].classList.add('on');
      }, 1150);
      setTimeout(function () { hint.classList.add('show'); }, 2300);
      setTimeout(function () {
        setInterval(function () {
          var prev = words[cur];
          cur = (cur + 1) % words.length;
          prev.classList.remove('on');
          prev.classList.add('out');
          setTimeout(function () { prev.classList.remove('out'); }, 900);
          words[cur].classList.add('on');
          fit();
        }, 2600);
      }, 1150);

      /* ---------- Main loop ---------- */
      function spring(l, key, target, k, c, dt) {
        var v = l['v' + key];
        v += (k * (target - l[key]) - c * v) * dt;
        l['v' + key] = v;
        l[key] += v * dt;
      }
      function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

      function drawFx(dt, t) {
        ctx.clearRect(0, 0, VW, VH);
        var RP = 140, k, q, dx, dy, d;

        // Shockwaves expand and fade.
        for (k = WAVES.length - 1; k >= 0; k--) {
          var w = WAVES[k];
          w.t += dt;
          var u = w.t / 0.8;
          if (u >= 1) { WAVES.splice(k, 1); continue; }
          w.r = (1 - Math.pow(1 - u, 3)) * w.max;
          ctx.beginPath();
          ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
          ctx.strokeStyle = col(0.3, 0.5 * (1 - u));
          ctx.lineWidth = 2 * (1 - u) + 0.5;
          ctx.stroke();
        }

        // Particles drift along a slowly shifting flow, flee the pointer and ride shockwaves.
        var nearList = [];
        for (k = 0; k < P.length; k++) {
          q = P[k];
          var ang = (Math.sin(q.x * 0.0042 + t * 0.25) + Math.cos(q.y * 0.0051 - t * 0.18) +
                     Math.sin((q.x + q.y) * 0.0021 + t * 0.11)) * 1.7;
          q.vx += (Math.cos(ang) * 18 - q.vx) * dt * 0.9;
          q.vy += (Math.sin(ang) * 18 - q.vy) * dt * 0.9;
          if (near) {
            dx = q.x - px; dy = q.y - py; d = Math.hypot(dx, dy) || 1;
            if (d < RP) {
              var f = 1 - d / RP;
              q.vx += dx / d * f * 900 * dt;
              q.vy += dy / d * f * 900 * dt;
            }
            if (d < 170 && nearList.length < 40) nearList.push(q);
          }
          for (var m = 0; m < WAVES.length; m++) {
            var wv = WAVES[m];
            dx = q.x - wv.x; dy = q.y - wv.y; d = Math.hypot(dx, dy) || 1;
            if (Math.abs(d - wv.r) < 40) {
              var push = (1 - wv.t / 0.8) * 2600 * dt;
              q.vx += dx / d * push; q.vy += dy / d * push;
            }
          }
          var sp = 1 + boost * 0.25;
          q.x += q.vx * dt * sp; q.y += q.vy * dt * sp;
          if (q.x < -10) q.x = VW + 10; else if (q.x > VW + 10) q.x = -10;
          if (q.y < -10) q.y = VH + 10; else if (q.y > VH + 10) q.y = -10;
          ctx.beginPath();
          ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2);
          ctx.fillStyle = col(q.p, q.a);
          ctx.fill();
        }

        // Constellation lines between particles around the pointer.
        ctx.lineWidth = 1;
        for (k = 0; k < nearList.length; k++) {
          var a1 = nearList[k];
          var dc = Math.hypot(a1.x - px, a1.y - py);
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(a1.x, a1.y);
          ctx.strokeStyle = col(a1.p, 0.12 * (1 - dc / 170)); ctx.stroke();
          for (var j = k + 1; j < nearList.length; j++) {
            var b = nearList[j];
            d = Math.hypot(a1.x - b.x, a1.y - b.y);
            if (d < 90) {
              ctx.beginPath(); ctx.moveTo(a1.x, a1.y); ctx.lineTo(b.x, b.y);
              ctx.strokeStyle = col((a1.p + b.p) / 2, 0.3 * (1 - d / 90) * (1 - dc / 170));
              ctx.stroke();
            }
          }
        }

        // Sparks: short streaks under gravity, fading out.
        ctx.lineCap = 'round';
        for (k = S.length - 1; k >= 0; k--) {
          var s = S[k];
          s.life -= dt;
          if (s.life <= 0) { S.splice(k, 1); continue; }
          s.vy += 700 * dt;
          s.vx *= Math.exp(-dt * 1.5); s.vy *= Math.exp(-dt * 0.6);
          s.x += s.vx * dt; s.y += s.vy * dt;
          var lf = s.life / s.max;
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - s.vx * 0.035, s.y - s.vy * 0.035);
          ctx.strokeStyle = col(s.p, 0.9 * lf);
          ctx.lineWidth = 1 + 1.4 * lf;
          ctx.stroke();
        }
      }

      var last = performance.now();
      function frame(nowAbs) {
        var dt = Math.min(1 / 30, (nowAbs - last) / 1000);
        last = nowAbs;
        var now = nowAbs - t0, t = now / 1000;

        boost *= Math.exp(-dt * 1.8);
        if (!drag || !drag.moved) { pvx *= Math.exp(-dt * 6); pvy *= Math.exp(-dt * 6); }

        // Marquee: a steady drift, sped up by pointer movement and clicks.
        rows.forEach(function (r) {
          if (!r.w) return;
          r.off = (r.off + r.speed * (1 + boost) * dt) % r.w;
          var x = r.dir < 0 ? -r.off : r.off - r.w;
          r.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,0,0)';
        });

        drawFx(dt, t);

        // Cursor ring trails the pointer and swells over letters.
        if (ring) {
          ringX += (px - ringX) * Math.min(1, dt * 16);
          ringY += (py - ringY) * Math.min(1, dt * 16);
          var targetS = (overLetter || (drag && drag.moved) ? 1.9 : 1) * (pressed ? 0.75 : 1);
          ringS += (targetS - ringS) * Math.min(1, dt * 12);
          ring.style.transform = 'translate3d(' + ringX.toFixed(1) + 'px,' + ringY.toFixed(1) + 'px,0) scale(' + ringS.toFixed(3) + ')';
          ring.classList.toggle('on', near);
          ring.classList.toggle('over', overLetter || !!(drag && drag.moved));
        }

        // Whole word leans toward the pointer; the shadow moves opposite, like a light source.
        var tyT = near ? (px / VW - 0.5) * 18 : 0;
        var txT = near ? -(py / VH - 0.5) * 12 : 0;
        tiltY += (tyT - tiltY) * Math.min(1, dt * 5);
        tiltX += (txT - tiltX) * Math.min(1, dt * 5);
        vis.style.transform = 'rotateX(' + tiltX.toFixed(2) + 'deg) rotateY(' + tiltY.toFixed(2) + 'deg)';
        h1.style.setProperty('--sx', (-tiltY * 0.5).toFixed(1) + 'px');
        h1.style.setProperty('--sy', (6 + tiltX * 0.5).toFixed(1) + 'px');

        var dragged = drag && drag.moved ? drag.l : null;
        var allDone = true;
        var R = fs * 2.4;
        for (var n = 0; n < L.length; n++) {
          var l = L[n];
          var started = now >= l.start;

          // Glyph scramble, settling on the real letter.
          var want = l.final;
          if (started && now < l.scrambleEnd) {
            allDone = false;
            if (now >= l.nextGlyph) {
              l.nextGlyph = now + 55;
              l.scrambleGlyph = l.pool[(Math.random() * l.pool.length) | 0];
            }
            want = l.scrambleGlyph;
          } else if (!started) {
            allDone = false;
          }
          if (want !== l.showing) { l.inn.textContent = want; l.showing = want; }

          // Targets: rest pose + idle wave + reaction to the pointer or a dragged neighbour.
          var tx = 0, ty = 0, trx = 0, trz = 0, ts = 1;
          var tryy = Math.sin(t * 1.1 - n * 0.5) * 10;
          ty += Math.sin(t * 1.8 - n * 0.55) * fs * 0.035;
          var k1 = 170, c1 = 14;
          if (!started) { trx = 95; ts = 0.8; ty = fs * 0.4; tryy = 0; }
          else if (l === dragged) {
            var c0 = centerOf(l);
            tx = px - drag.ox - c0.x;
            ty = py - drag.oy - c0.y;
            trz = clamp(pvx * 0.025, -35, 35);
            ts = 1.25; tryy = 0;
            k1 = 700; c1 = 40;
          } else if (dragged) {
            // Neighbours are tugged along like links in a chain.
            var pull = Math.pow(0.42, Math.abs(n - dragged.i));
            tx += dragged.x * pull;
            ty += dragged.y * pull;
            trz += dragged.rz * pull * 0.5;
          } else if (near) {
            var c2 = centerOf(l);
            var dx = c2.x - px, dy = c2.y - py;
            var d = Math.hypot(dx, dy) || 1;
            var f = Math.max(0, 1 - d / R);
            f *= f;
            tx += dx / d * f * fs * 0.45;
            ty += dy / d * f * fs * 0.45;
            trz += dx / d * f * 22;
            ts += f * 0.2;
          }

          if (started) {
            spring(l, 'x', tx, k1, c1, dt);
            spring(l, 'y', ty, k1, c1, dt);
            spring(l, 'rx', trx, 150, 9, dt);   // light damping: overshoots as it flips up
            spring(l, 'ry', tryy, 120, 12, dt);
            spring(l, 'rz', trz, 140, 11, dt);
            spring(l, 's', ts, 200, 15, dt);

            // Fast-moving letters shed a trail of sparks.
            var speed = Math.hypot(l.vx, l.vy);
            if (speed > 650 && Math.random() < 0.7) {
              var cc = centerOf(l);
              spark(cc.x + l.x, cc.y + l.y,
                    -l.vx * 0.12 + (Math.random() - 0.5) * 90, -l.vy * 0.12 + (Math.random() - 0.5) * 90,
                    0.35 + Math.random() * 0.25);
            }
          }
          l.op += ((started ? 1 : 0) - l.op) * Math.min(1, dt * 8);

          l.inn.style.opacity = l.op.toFixed(3);
          l.inn.style.transform =
            'translate3d(' + l.x.toFixed(2) + 'px,' + l.y.toFixed(2) + 'px,0)' +
            ' rotateX(' + l.rx.toFixed(2) + 'deg) rotateY(' + l.ry.toFixed(2) + 'deg)' +
            ' rotateZ(' + l.rz.toFixed(2) + 'deg) scale(' + l.s.toFixed(3) + ')';
        }
        if (allDone && widthsLocked) { widthsLocked = false; unlockWidths(); }

        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
